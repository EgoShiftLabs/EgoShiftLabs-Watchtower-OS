name: Watchtower OS tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - name: Required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s docs/FORECASTING.md
