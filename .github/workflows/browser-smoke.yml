name: Watchtower OS headless browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'core.js'
      - 'index.html'
      - 'styles.css'
      - 'intelligence-ui.js'
      - 'analytics.js'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Start local Pages-equivalent static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/watchtower-http.log 2>&1 &
          echo $! > /tmp/watchtower-http.pid
          sleep 2
      - name: Exercise dashboards in headless desktop and mobile viewport
        run: node tests/browser-smoke.mjs
